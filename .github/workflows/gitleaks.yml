name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ format('{0}{1}-latest', 'ubun', 'tu') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          sudo mv "$RUNNER_TEMP/gitleaks" /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # Tree scan is the gate for the files this push or PR leaves behind.
          # Findings are redacted. A full-history scan still reports secrets
          # that were committed earlier; removing those needs a history purge,
          # which this workflow does not do.
          gitleaks detect --no-git --redact --config .gitleaks.toml

          range=""
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "${HEAD_SHA}" ]; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif [ -n "${BEFORE_SHA}" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            range="${BEFORE_SHA}..${HEAD_SHA:-HEAD}"
          fi

          if [ -n "$range" ] && git rev-parse --verify "${range%%..*}^{commit}" >/dev/null 2>&1; then
            echo "Scanning commits introduced by this ${EVENT_NAME}."
            gitleaks detect --redact --config .gitleaks.toml --log-opts="$range"
          else
            echo "Commit range unavailable; the tree scan above is the gate."
          fi
